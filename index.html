<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Chhaon maps Lahore's lost green cover, measures its heat cost, and ranks where to plant trees back."
    />
    <title>Chhaon — where Lahore lost its shade</title>

    <!--
      Self-hosted, so no font request leaves the origin. The previous Google
      Fonts link made 5 requests to fonts.gstatic.com for ~395 KB, of which 233 KB
      was Noto Nastaliq Urdu for the single word چھاؤں. That face is now subsetted
      to the wordmark at 20 KB.

      Map tiles and imagery are still third-party and deliberately so — that is
      why there is no tile server to run — so this gets us to "nothing but tiles
      leaves the origin", which is as far as map-performance's zero-third-party
      rule can be taken without self-hosting a basemap.

      Regenerate with `python scripts/fetch_fonts.py`.

      Deliberately NOT preloaded. With `font-display: swap` these faces never
      block meaningful paint — the text is readable immediately in a fallback and
      restyles when they land — so putting 148 KB of them on the critical path
      with `preload` would take pipe away from the bundle the map needs to exist
      at all, for a purely cosmetic gain.

      Measured on the production build at Fast 3G: 3.7-4.0 s to measurements on
      screen, with the same figure whether the faces are preloaded or not. Run-to-
      run variance here is a few hundred ms depending on when basemap tiles settle,
      so do not read a single run as a regression. `node scripts/budget.mjs --3g`.
    -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
